<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票数据分析平台</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>股票数据分析平台</h1>
            <nav class="nav">
                <a href="/" class="nav-link active">数据查看</a>
                <a href="/training" class="nav-link">模型训练</a>
                <a href="/backtest" class="nav-link">策略回测</a>
            </nav>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="stockCode">股票/ETF代码</label>
                <input type="text" id="stockCode" value="000001" placeholder="输入股票/ETF代码">
            </div>
            <div class="control-group">
                <button id="fetchBtn" class="btn btn-primary">获取数据</button>
            </div>
        </div>

        <div class="charts-section">
            <div class="section-header">
                <h2>市场走势</h2>
            </div>
            <div class="charts-grid">
                <div class="chart-box">
                    <h3>价格走势</h3>
                    <canvas id="priceChart"></canvas>
                </div>
                <div class="chart-box">
                    <h3>成交量</h3>
                    <canvas id="volumeChart"></canvas>
                </div>
            </div>
        </div>

        <div class="indicators-grid">
            <div class="indicator-box">
                <h3>KDJ指标</h3>
                <canvas id="kdjChart"></canvas>
            </div>
            <div class="indicator-box">
                <h3>MACD指标</h3>
                <canvas id="macdChart"></canvas>
            </div>
        </div>

        <div class="signals-section">
            <div class="section-header">
                <h2>交易信号</h2>
            </div>
            <div id="signalsContainer" class="signals-grid">
                <div class="empty-state">
                    <span class="empty-state-icon">📊</span>
                    <p>还没有交易数据，点击"获取数据"按钮开始体验</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
