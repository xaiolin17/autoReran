<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票数据分析平台</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>股票数据分析平台</h1>
            <nav class="nav">
                <a href="/" class="nav-link active">数据查看</a>
                <a href="/training" class="nav-link">模型训练</a>
                <a href="/backtest" class="nav-link">策略回测</a>
            </nav>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="stockCode">股票/ETF代码</label>
                <input type="text" id="stockCode" value="000001" placeholder="输入股票/ETF代码">
            </div>
            <div class="control-group">
                <button id="fetchBtn" class="btn btn-primary">获取数据</button>
            </div>
        </div>

        <div class="charts-container">
            <div class="section-header">
                <h2>市场走势</h2>
            </div>
            <div id="klineChart" class="kline-chart"></div>
        </div>

        <div class="indicators-container">
            <div class="section-header">
                <h2>技术指标</h2>
            </div>
            <div class="tabs">
                <button class="tab active" data-tab="kdj">KDJ</button>
                <button class="tab" data-tab="macd">MACD</button>
            </div>
            <div id="kdjChart" class="indicator-chart"></div>
            <div id="macdChart" class="indicator-chart hidden"></div>
        </div>

        <div class="signals-section">
            <div class="section-header">
                <h2>交易信号</h2>
            </div>
            <div id="signalsContainer" class="signals-grid">
                <div class="empty-state">
                    <span class="empty-state-icon">📊</span>
                    <p>还没有交易数据，点击"获取数据"按钮开始体验</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
