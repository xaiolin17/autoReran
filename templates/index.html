<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARN</title>
    <link rel="stylesheet" href="/static/css/style.css?v=20260519-fix-mark">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>ARN</h1>
            <nav class="nav">
                <a href="/" class="nav-link active">数据查看</a>
                <a href="/training" class="nav-link">模型训练</a>
                <a href="/backtest" class="nav-link">策略回测</a>
            </nav>
        </header>

        <div class="controls">
            <div class="control-group stock-code-search">
                <label for="stockCode">股票/ETF代码</label>
                <input type="text" id="stockCode" value="000001.SH" placeholder="输入股票/ETF代码" autocomplete="off">
                <div id="searchResults" class="search-results" style="display: none;"></div>
            </div>
            <div class="control-group">
                <label for="startDate">开始日期</label>
                <input type="date" id="startDate">
            </div>
            <div class="control-group">
                <label for="endDate">结束日期</label>
                <input type="date" id="endDate">
            </div>
            <div class="control-group">
                <button id="fetchBtn" class="btn btn-primary">获取数据</button>
            </div>
            <div class="control-group">
                <button id="forceRefreshBtn" class="btn btn-warning">⚡ 强制刷新历史数据</button>
            </div>
        </div>

        <div id="progressBox" class="progress-box" style="display: none;">
            <div class="progress-box-header">
                <span class="progress-box-title">后台任务进度</span>
                <button id="closeProgressBox" class="progress-box-close">×</button>
            </div>
            <div class="progress-box-content">
                <div class="progress-box-bar">
                    <div id="progressBoxFill" class="progress-box-fill"></div>
                </div>
                <span id="progressBoxStep" class="progress-box-step">--</span>
                <span id="progressBoxPercent" class="progress-box-percent">0%</span>
            </div>
        </div>

        <div class="indicators-container">
            <div class="section-header">
                <h2 id="chartTitle">K线与指标</h2>
            </div>
            <div class="chart-info-bar">
                <span id="stockNameDisplay" class="stock-name-display"></span>
            </div>
            <div class="signal-toggle-container">
                <label class="signal-toggle-label" for="signalToggle">
                    <span class="signal-toggle-text">显示交易信号</span>
                    <input type="checkbox" id="signalToggle" class="signal-toggle-input">
                    <span class="signal-toggle-switch"></span>
                </label>
            </div>
            <div class="indicator-tabs">
                <button class="indicator-tab active" data-indicator="macd">MACD</button>
                <button class="indicator-tab" data-indicator="kdj">KDJ</button>
            </div>
            <div class="chart-wrapper">
                <button id="refreshBtn" class="btn btn-secondary btn-sm chart-refresh-btn">🔄 刷新数据</button>
                <div id="mainChart" class="main-chart"></div>
            </div>
        </div>

        <div id="markPopupMenu" class="mark-popup-menu" style="display: none;">
            <button class="mark-popup-btn mark-buy" data-action="buy">📈 买入</button>
            <button class="mark-popup-btn mark-sell" data-action="sell">📉 卖出</button>
            <button class="mark-popup-btn mark-clear" data-action="clear">🗑️ 清除标记</button>
        </div>
    </div>

    <script src="/static/js/main.js?v=20260519-fix-mark"></script>
</body>
</html>
