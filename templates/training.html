<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型训练 - ARN</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>机器学习模型训练</h1>
            <nav class="nav">
                <a href="/" class="nav-link">数据查看</a>
                <a href="/training" class="nav-link active">模型训练</a>
                <a href="/backtest" class="nav-link">策略回测</a>
            </nav>
        </header>

        <div class="content-grid">
            <div class="form-box">
                <h2>训练新模型</h2>
                <form id="trainForm" class="form">
                    <div class="form-group">
                        <label for="trainStockCode">股票代码</label>
                        <input type="text" id="trainStockCode" value="000001" placeholder="输入股票代码">
                    </div>
                    <div class="form-group">
                        <label for="modelName">模型名称</label>
                        <input type="text" id="modelName" value="model_01" placeholder="输入模型名称">
                    </div>
                    <div class="form-group">
                        <label for="modelType">模型类型</label>
                        <select id="modelType">
                            <option value="RandomForest">随机森林</option>
                            <option value="LinearRegression">线性回归</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>训练模式</label>
                        <div class="radio-group">
                            <label><input type="radio" name="trainingMode" value="regression" checked> 价格预测</label>
                            <label><input type="radio" name="trainingMode" value="classification"> 涨跌判断</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="trainSize">训练集比例</label>
                        <input type="number" id="trainSize" value="0.8" min="0.5" max="0.95" step="0.05">
                    </div>
                    <button type="submit" class="btn btn-primary btn-large">开始训练</button>
                </form>
            </div>

            <div class="list-box">
                <h2>已训练模型</h2>
                <div id="modelsList" class="models-list">
                    <div class="empty-state">
                        <span class="empty-state-icon">🤖</span>
                        <p>还没有训练模型，先在左侧填写信息开始训练</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/training.js"></script>
</body>
</html>
