<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型训练 - 股票数据分析平台</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🤖 机器学习模型训练</h1>
            <nav class="nav">
                <a href="/" class="nav-link">数据查看</a>
                <a href="/training" class="nav-link active">模型训练</a>
                <a href="/backtest" class="nav-link">策略回测</a>
            </nav>
        </header>

        <div class="content-grid">
            <div class="form-card">
                <h2>训练新模型</h2>
                <form id="trainForm" class="form">
                    <div class="form-group">
                        <label for="trainStockCode">股票代码</label>
                        <input type="text" id="trainStockCode" value="SAMPLE" placeholder="输入股票代码">
                    </div>
                    <div class="form-group">
                        <label for="modelName">模型名称</label>
                        <input type="text" id="modelName" value="model_01" placeholder="输入模型名称">
                    </div>
                    <div class="form-group">
                        <label for="modelType">模型类型</label>
                        <select id="modelType">
                            <option value="RandomForest">随机森林</option>
                            <option value="LinearRegression">线性回归</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>训练模式</label>
                        <div class="radio-group">
                            <label><input type="radio" name="trainingMode" value="regression" checked> 价格预测（回归）</label>
                            <label><input type="radio" name="trainingMode" value="classification"> 涨跌判断（分类）</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="trainSize">训练集比例</label>
                        <input type="number" id="trainSize" value="0.8" min="0.5" max="0.95" step="0.05">
                    </div>
                    <button type="submit" class="btn btn-primary btn-large">开始训练</button>
                </form>
                <div id="trainingStatus" class="status-message" style="display: none;"></div>
            </div>

            <div class="list-card">
                <h2>已训练模型</h2>
                <div id="modelsList" class="models-list">
                    <p class="empty-state">暂无模型</p>
                </div>
            </div>
        </div>

        <div class="prediction-section">
            <h2>🔮 AI 信号预测</h2>
            <div class="prediction-controls">
                <div class="control-group">
                    <label for="predictModel">选择模型</label>
                    <select id="predictModel">
                        <option value="">-- 请选择模型 --</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="predictStock">股票代码</label>
                    <input type="text" id="predictStock" value="SAMPLE">
                </div>
                <button id="predictBtn" class="btn btn-primary">价格预测</button>
                <button id="predictSignalBtn" class="btn btn-success">信号预测</button>
            </div>
            <div id="predictionResult" class="prediction-result" style="display: none;"></div>
        </div>

        <div class="prediction-section">
            <h2>🧩 多模型综合预测</h2>
            <div class="prediction-controls">
                <div class="control-group">
                    <label>选择模型（可多选）</label>
                    <div id="ensembleModelsList" class="checkbox-group">
                        <p style="color: #a0aec0; font-size: 13px;">请先训练模型</p>
                    </div>
                </div>
                <div class="control-group">
                    <label for="ensembleStock">股票代码</label>
                    <input type="text" id="ensembleStock" value="SAMPLE">
                </div>
                <div class="control-group">
                    <label>综合方法</label>
                    <div class="radio-group">
                        <label><input type="radio" name="ensembleMethod" value="voting" checked> 投票制</label>
                        <label><input type="radio" name="ensembleMethod" value="weighted"> 加权制</label>
                    </div>
                </div>
                <button id="ensemblePredictBtn" class="btn btn-warning btn-large">开始综合预测</button>
            </div>
            <div id="ensembleResult" class="prediction-result" style="display: none;"></div>
        </div>
    </div>

    <script src="/static/js/training.js"></script>
</body>
</html>
