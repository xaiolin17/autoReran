<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>策略回测 - ARN</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>策略回测</h1>
            <nav class="nav">
                <a href="/" class="nav-link">数据查看</a>
                <a href="/training" class="nav-link">模型训练</a>
                <a href="/backtest" class="nav-link active">策略回测</a>
            </nav>
        </header>

        <div class="content-grid">
            <div class="form-box">
                <h2>回测配置</h2>
                <form id="backtestForm" class="form">
                    <div class="form-group">
                        <label for="backtestStockCode">股票代码</label>
                        <input type="text" id="backtestStockCode" value="000001.SH" placeholder="输入股票代码">
                    </div>
                    <div class="form-group">
                        <label for="strategyName">策略类型</label>
                        <select id="strategyName">
                            <option value="TRADITIONAL">传统策略</option>
                            <option value="ML">机器学习策略</option>
                        </select>
                    </div>
                    <div class="form-group" id="mlModelGroup" style="display: none;">
                        <label for="mlModelSelect">选择训练模型</label>
                        <select id="mlModelSelect">
                            <option value="">-- 请选择模型 --</option>
                        </select>
                    </div>
                    <div id="noModelsMessage" class="warning-message" style="display: none; padding: 16px; background: rgba(245, 158, 11, 0.1); border-radius: 12px; border: 1px solid rgba(245, 158, 11, 0.3); margin-bottom: 16px;">
                        <p style="margin: 0; color: #f59e0b; font-size: 14px;">
                            ⚠️ 暂无已训练模型，<a href="/training" style="color: #00f0ff; text-decoration: underline;">请先进行模型训练</a>
                        </p>
                    </div>
                    <div class="form-group">
                        <label for="startDate">开始日期</label>
                        <input type="date" id="startDate">
                    </div>
                    <div class="form-group">
                        <label for="endDate">结束日期</label>
                        <input type="date" id="endDate">
                    </div>
                    <div class="form-group">
                        <label for="initialCapital">初始资金</label>
                        <input type="number" id="initialCapital" value="100000" min="10000" step="10000">
                    </div>
                    <button type="submit" class="btn btn-primary btn-large">运行回测</button>
                </form>
            </div>

            <div class="list-box">
                <h2>回测结果</h2>
                <div id="backtestsList" class="models-list">
                    <div class="empty-state">
                        <span class="empty-state-icon">📈</span>
                        <p>还没有回测结果，先在左侧配置并运行回测</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="backtestResultDetail" class="results-section" style="display: none;">
            <h2>回测详情</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">总收益率</div>
                    <div class="stat-value" id="totalReturn">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">年化收益率</div>
                    <div class="stat-value" id="annualReturn">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">最大回撤</div>
                    <div class="stat-value" id="maxDrawdown">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">胜率</div>
                    <div class="stat-value" id="winRate">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">总交易次数</div>
                    <div class="stat-value" id="totalTrades">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">最终资金</div>
                    <div class="stat-value" id="finalCapital">-</div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/backtest.js"></script>
</body>
</html>
